name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    name: release binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build asg-cli (agentscope)
        run: cargo build --release --target ${{ matrix.target }} -p asg-cli

      - name: Install eBPF build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup toolchain install nightly --component rust-src
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18 lld-18
          LLVM_SYS_180_PREFIX=/usr/lib/llvm-18 cargo install bpf-linker --version 0.9.13 --locked

      - name: Build eBPF probe
        if: matrix.os == 'ubuntu-latest'
        working-directory: bpf/asg-ebpf
        run: cargo +nightly build --locked --release -Z build-std

      - name: Package (Linux, including eBPF probe)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/agentscope dist/
          cp bpf/asg-ebpf/target/bpfel-unknown-none/release/asg-ebpf dist/asg.bpf.o
          tar czf agentscope-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist agentscope asg.bpf.o

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../agentscope-${{ github.ref_name }}-${{ matrix.target }}.tar.gz agentscope
          cd -
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/agentscope.exe -DestinationPath agentscope-${{ github.ref_name }}-${{ matrix.target }}.zip
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agentscope-*.tar.gz
            agentscope-*.zip
