[workspace]
resolver = "2"
members = [
    "asg-common",
    "asg-policy",
    "asg-api",
    "asg-collector",
    "asg-cli",
]
exclude = ["bpf/asg-ebpf"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sambai-dev/agentscope"
homepage = "https://github.com/sambai-dev/agentscope"
authors = ["sambai-dev"]

[workspace.dependencies]
asg-common = { path = "asg-common" }
asg-policy = { path = "asg-policy" }
asg-api = { path = "asg-api" }
asg-collector = { path = "asg-collector" }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
